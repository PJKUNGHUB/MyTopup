<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PhuPha Store - Telegram Link Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        .page-hidden { display: none !important; }
        /* แก้ไขให้ Modal อยู่กึ่งกลางหน้าจอเป๊ะทุกอุปกรณ์ */
        .modal-overlay { 
            position: fixed; 
            inset: 0; 
            background-color: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            z-index: 9999; 
        }
        .btn-primary { background-color: #42B0FF; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <nav class="p-5 bg-white shadow-sm sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-[#42B0FF] rounded-xl flex items-center justify-center text-white font-bold shadow-lg">P</div>
            <h1 class="font-bold text-lg">PhuPha <span class="text-[#42B0FF]">Store</span></h1>
        </div>
        <button onclick="unlockAdmin()" class="text-slate-300 p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </button>
    </nav>

    <section id="page-user" class="max-w-md mx-auto p-5 space-y-6">
        <div class="bg-white p-8 rounded-[35px] text-center shadow-sm border border-blue-50">
            <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">ยอดสต็อกคงเหลือ</p>
            <h2 id="stk-display" class="text-5xl font-bold text-slate-700">0.00 <span class="text-xl text-[#42B0FF]">฿</span></h2>
        </div>
        <button onclick="openModal()" class="w-full btn-primary text-white font-bold py-5 rounded-[24px] shadow-xl text-lg">สั่งซื้อสินค้า</button>
        <div id="user-history" class="space-y-3 mt-4"></div>
    </section>

    <section id="page-admin" class="page-hidden max-w-md mx-auto p-5 space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold">Admin Panel</h2>
            <button onclick="location.reload()" class="text-red-500 font-bold">ปิด</button>
        </div>
        <div class="bg-slate-900 p-6 rounded-[30px] space-y-3 text-white">
            <p class="text-xs font-bold text-slate-400">แก้ไขสต็อก (ใส่ตัวเลข)</p>
            <input id="input-stk" type="number" class="w-full bg-white/10 p-4 rounded-2xl outline-none" placeholder="0.00">
            <button onclick="updateStock()" class="w-full bg-[#42B0FF] text-white py-4 rounded-2xl font-bold">บันทึกสต็อก</button>
        </div>
        <div id="admin-order-list" class="space-y-4"></div>
    </section>

    <div id="order-modal" class="modal-overlay hidden">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 space-y-4 shadow-2xl">
            <h3 class="text-xl font-bold text-center">รายละเอียดออเดอร์</h3>
            <input id="f-game" type="text" placeholder="ชื่อเกม" class="w-full bg-slate-50 p-4 rounded-2xl border outline-none">
            <input id="f-price" type="number" placeholder="ราคา" class="w-full bg-slate-50 p-4 rounded-2xl border outline-none">
            <select id="f-cat" class="w-full bg-slate-50 p-4 rounded-2xl border outline-none">
                <option value="เงินในเกม">เงินในเกม</option>
                <option value="สกิน/ไอเทม">สกิน / ไอเทม</option>
            </select>
            <div class="p-4 bg-blue-50 rounded-2xl border-dashed border-2 border-blue-200 text-center">
                <label class="text-[10px] font-bold text-blue-500 block mb-2">แนบรูปสลิป</label>
                <input id="f-img" type="file" accept="image/*" class="w-full text-xs">
            </div>
            <div class="flex space-x-3 pt-4">
                <button onclick="closeModal()" class="flex-1 py-4 text-slate-400 font-bold">ยกเลิก</button>
                <button onclick="submitOrder()" id="btn-submit" class="flex-[2] btn-primary text-white py-4 rounded-2xl font-bold shadow-lg">ยืนยัน</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://devpwalvthufklbqtozw.supabase.co";
        const SB_KEY = "sb_publishable_jLl5GwgE4JUlGylq0KSrOQ_sOFPG3Gj";
        const TG_BOT_TOKEN = "8301236781:AAE0V-SQx7Jtc8tlKSZLebScu6hnvHqy0aE";
        const CHAT_ID = "8033387742";
        const ADMIN_PASS = "Inwza007";

        const _sb = supabase.createClient(SB_URL, SB_KEY);

        window.onload = () => {
            fetchStock();
            fetchUserHistory();
            checkDeepLink();
            _sb.channel('realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                fetchUserHistory();
                if(!document.getElementById('page-admin').classList.contains('page-hidden')) fetchAdminOrders();
            }).on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, fetchStock).subscribe();
        };

        // ระบบรับคำสั่งเมื่อกดลิงก์จาก Telegram
        async function checkDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const action = params.get('action');
            const oid = params.get('oid');
            if (action && oid) {
                const code = prompt("รหัส Admin เพื่อยืนยันออเดอร์:");
                if(code === ADMIN_PASS) {
                    unlockAdminView();
                    await updateStatus(oid, action);
                }
            }
        }

        async function fetchStock() {
            const { data } = await _sb.from('settings').select('value').eq('key', 'stock').single();
            if(data) document.getElementById('stk-display').innerHTML = `${parseFloat(data.value).toLocaleString()} <span class="text-xl text-[#42B0FF]">฿</span>`;
        }

        function openModal() { document.getElementById('order-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('order-modal').classList.add('hidden'); }

        async function submitOrder() {
            const game = document.getElementById('f-game').value;
            const price = document.getElementById('f-price').value;
            const cat = document.getElementById('f-cat').value;
            const file = document.getElementById('f-img').files[0];
            if(!game || !price || !file) return alert("กรอกข้อมูลและเลือกรูปภาพ!");

            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerText = "กำลังอัปโหลด...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const oid = 'PH-' + Math.floor(1000 + Math.random() * 9000);
                const { error } = await _sb.from('orders').insert([{ order_id: oid, game, price, category: cat, image_url: reader.result, status: 'pending' }]);
                
                if(!error) {
                    await sendTelegram(oid, game, price, cat, file);
                    let local = JSON.parse(localStorage.getItem('my_orders') || '[]');
                    local.unshift(oid);
                    localStorage.setItem('my_orders', JSON.stringify(local));
                    alert("ส่งออเดอร์สำเร็จ!");
                    location.reload();
                }
            };
        }

        // --- ระบบส่ง Telegram แบบบังคับให้เป็นลิงก์ ---
        async function sendTelegram(oid, game, price, cat, file) {
            const currentUrl = window.location.href.split('?')[0];
            
            const caption = `🔔 *มีออเดอร์ใหม่!*
━━━━━━━━━━━━
🆔 ID: \`${oid}\`
🎮 เกม: *${game}*
💰 ราคา: *${price}฿*
📂 หมวดหมู่: *${cat}*

💬 *จัดการออเดอร์ (กดที่ลิงก์):*
✅ [คลิกเพื่ออนุมัติ (OK)](${currentUrl}?action=success&oid=${oid})
❌ [คลิกเพื่อปฏิเสธ (NO)](${currentUrl}?action=rejected&oid=${oid})`;

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', file);
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');

            await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }

        async function fetchUserHistory() {
            const ids = JSON.parse(localStorage.getItem('my_orders') || '[]');
            if(ids.length === 0) return;
            const { data } = await _sb.from('orders').select('*').in('order_id', ids).order('created_at', {ascending: false});
            document.getElementById('user-history').innerHTML = data.map(o => `
                <div class="bg-white p-5 rounded-3xl border flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-bold text-slate-700">${o.game} - ${o.price}฿</p>
                        <p class="text-[10px] text-slate-400">🆔 ${o.order_id}</p>
                    </div>
                    <span class="text-[9px] font-bold px-3 py-1.5 rounded-full ${o.status === 'success' ? 'bg-green-50 text-green-500' : 'bg-amber-50 text-amber-500'}">${o.status}</span>
                </div>
            `).join('');
        }

        function unlockAdmin() { 
            if(prompt("รหัสผ่านผู้ดูแล:") === ADMIN_PASS) unlockAdminView(); 
        }

        function unlockAdminView() {
            document.getElementById('page-user').classList.add('page-hidden');
            document.getElementById('page-admin').classList.remove('page-hidden');
            fetchAdminOrders();
        }

        async function updateStock() {
            const val = document.getElementById('input-stk').value;
            await _sb.from('settings').update({ value: val }).eq('key', 'stock');
            alert("บันทึกสต็อกแล้ว");
        }

        async function fetchAdminOrders() {
            const { data } = await _sb.from('orders').select('*').eq('status', 'pending').order('created_at', {ascending: false});
            document.getElementById('admin-order-list').innerHTML = data.map(o => `
                <div class="bg-white p-6 rounded-[35px] border shadow-sm space-y-4">
                    <p class="font-bold text-lg">${o.game} - ${o.price}฿</p>
                    <img src="${o.image_url}" class="w-full h-48 object-cover rounded-3xl border">
                    <div class="flex space-x-2">
                        <button onclick="updateStatus('${o.order_id}', 'success')" class="flex-1 bg-green-500 text-white py-4 rounded-2xl font-bold">อนุมัติ</button>
                        <button onclick="updateStatus('${o.order_id}', 'rejected')" class="flex-1 bg-red-500 text-white py-4 rounded-2xl font-bold">ปฏิเสธ</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 py-10">ไม่มีออเดอร์ค้าง</p>';
        }

        window.updateStatus = async (oid, status) => {
            let reason = status === 'rejected' ? prompt("เหตุผลที่ปฏิเสธ:") : "สำเร็จ";
            const { error } = await _sb.from('orders').update({ status, reason }).eq('order_id', oid);
            if(!error) {
                fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: CHAT_ID, text: `✅ จัดการออเดอร์ ${oid} เรียบร้อย` })
                });
                fetchAdminOrders();
            }
        };
    </script>
</body>
</html>
