<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhuPha Store - Instant Action</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .page-hidden { display: none !important; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
    </style>
</head>
<body>

    <nav class="p-5 bg-white shadow-sm flex justify-between items-center">
        <h1 class="font-bold text-lg">PhuPha Store</h1>
        <button onclick="unlockAdmin()" class="text-slate-300">Admin</button>
    </nav>

    <section id="page-user" class="max-w-md mx-auto p-5">
        <div class="bg-white p-8 rounded-[35px] text-center shadow-sm border mb-6">
            <p class="text-xs text-slate-400">ยอดสต็อก</p>
            <h2 id="stk-display" class="text-4xl font-bold">0.00 ฿</h2>
        </div>
        <button onclick="document.getElementById('order-modal').classList.remove('hidden')" class="w-full bg-[#42B0FF] text-white py-4 rounded-2xl font-bold">สั่งซื้อสินค้า</button>
        <div id="user-history" class="mt-6 space-y-2"></div>
    </section>

    <div id="auto-processing" class="page-hidden fixed inset-0 bg-white flex flex-col items-center justify-center z-[1000]">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
        <p class="font-bold text-slate-600" id="process-text">กำลังจัดการออเดอร์...</p>
    </div>

    <div id="order-modal" class="modal-overlay hidden">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-6 space-y-4">
            <input id="f-game" type="text" placeholder="ชื่อเกม" class="w-full p-4 border rounded-xl outline-none">
            <input id="f-price" type="number" placeholder="ราคา" class="w-full p-4 border rounded-xl outline-none">
            <input id="f-img" type="file" accept="image/*" class="w-full">
            <div class="flex space-x-2">
                <button onclick="this.parentElement.parentElement.parentElement.classList.add('hidden')" class="flex-1">ยกเลิก</button>
                <button onclick="submitOrder()" id="btn-submit" class="flex-1 bg-blue-500 text-white py-3 rounded-xl">ยืนยัน</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://devpwalvthufklbqtozw.supabase.co";
        const SB_KEY = "sb_publishable_jLl5GwgE4JUlGylq0KSrOQ_sOFPG3Gj";
        const TG_BOT_TOKEN = "8301236781:AAE0V-SQx7Jtc8tlKSZLebScu6hnvHqy0aE";
        const CHAT_ID = "8033387742";
        const ADMIN_PASS = "Inwza007"; // รหัสผ่านที่จะใช้ยืนยันในลิงก์ด้วย

        const _sb = supabase.createClient(SB_URL, SB_KEY);

        window.onload = () => {
            fetchStock();
            fetchUserHistory();
            checkDeepLink();
        };

        // --- ฟังก์ชัน "จิ้มปุ๊บ จบปั๊บ" ---
        async function checkDeepLink() {
            const p = new URLSearchParams(window.location.search);
            const action = p.get('action');
            const oid = p.get('oid');
            const token = p.get('token'); // รหัสลับที่ส่งมาจาก Telegram

            if (action && oid && token === ADMIN_PASS) {
                // แสดงหน้าจอประมวลผล
                document.getElementById('auto-processing').classList.remove('page-hidden');
                document.getElementById('process-text').innerText = `กำลัง ${action === 'success' ? 'อนุมัติ' : 'ปฏิเสธ'} ออเดอร์ ${oid}...`;

                try {
                    const { error } = await _sb.from('orders').update({ 
                        status: action, 
                        reason: action === 'success' ? 'สำเร็จอัตโนมัติ' : 'ถูกปฏิเสธโดยแอดมิน' 
                    }).eq('order_id', oid);

                    if (!error) {
                        // แจ้งเตือนกลับไปที่ Telegram
                        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ 
                                chat_id: CHAT_ID, 
                                text: `⚡️ [Instant] ออเดอร์ *${oid}* ถูกจัดการเรียบร้อยแล้ว (${action.toUpperCase()})`,
                                parse_mode: 'Markdown'
                            })
                        });
                        document.getElementById('process-text').innerText = "✅ จัดการสำเร็จ! กำลังปิดหน้าต่าง...";
                        setTimeout(() => window.close(), 1500); // พยายามปิดหน้าต่างเอง
                    }
                } catch (e) {
                    alert("เกิดข้อผิดพลาด: " + e.message);
                }
            }
        }

        async function submitOrder() {
            const game = document.getElementById('f-game').value;
            const price = document.getElementById('f-price').value;
            const file = document.getElementById('f-img').files[0];
            if(!game || !price || !file) return alert("ข้อมูลไม่ครบ");

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const oid = 'PH-' + Math.floor(1000 + Math.random() * 9000);
                await _sb.from('orders').insert([{ order_id: oid, game, price, image_url: reader.result, status: 'pending' }]);
                await sendTelegram(oid, game, price, file);
                alert("ส่งออเดอร์แล้ว!");
                location.reload();
            };
        }

        // --- ส่งปุ่มที่มีรหัสลับฝังไว้ ---
        async function sendTelegram(oid, game, price, file) {
            const currentUrl = window.location.href.split('?')[0];
            const baseLink = `${currentUrl}?oid=${oid}&token=${ADMIN_PASS}`; // ฝัง Token ไปในลิงก์เลย

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', file);
            formData.append('caption', `🔔 *ออเดอร์ใหม่*\n🆔 ID: \`${oid}\`\n🎮 เกม: *${game}*\n💰 ราคา: *${price}฿*`);
            formData.append('parse_mode', 'Markdown');

            const keyboard = {
                inline_keyboard: [[
                    { text: "✅ อนุมัติทันที", url: `${baseLink}&action=success` },
                    { text: "❌ ปฏิเสธทันที", url: `${baseLink}&action=rejected` }
                ]]
            };
            formData.append('reply_markup', JSON.stringify(keyboard));
            await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }

        async function fetchStock() {
            const { data } = await _sb.from('settings').select('value').eq('key', 'stock').single();
            if(data) document.getElementById('stk-display').innerText = data.value + " ฿";
        }

        async function fetchUserHistory() {
            const { data } = await _sb.from('orders').select('*').limit(5).order('created_at', {ascending: false});
            document.getElementById('user-history').innerHTML = data.map(o => `
                <div class="bg-white p-3 rounded-xl border flex justify-between text-sm shadow-sm">
                    <span>${o.game} (${o.price}฿)</span>
                    <span class="font-bold ${o.status === 'success' ? 'text-green-500' : 'text-amber-500'}">${o.status}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
